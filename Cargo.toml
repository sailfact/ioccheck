[package]
name = "ioccheck"
version = "0.1.0"
edition = "2021"
authors = ["ioccheck contributors"]
description = "CLI for enriching indicators of compromise using public threat intelligence sources."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sailfact/ioccheck"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
dotenvy = "0.15"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
